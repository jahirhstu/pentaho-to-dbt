# Shared local and Databricks Workflow profile. Never put a token literal here.
pentaho_to_databricks:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: dbt_dev
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4

    job:
      type: databricks
      method: http
      catalog: workspace
      schema: dbt_dev
      host: dbc-6a1c9cc6-e36f.cloud.databricks.com
      http_path: /sql/1.0/warehouses/75e2e734a3527ecb
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      threads: 4
