[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-producer"
version = "0.1.0"
description = "Deterministic synthetic Kafka event producer for the Pentaho to dbt project"
requires-python = ">=3.11"
dependencies = [
  "Faker==37.12.0",
  "confluent-kafka==2.12.2",
]

[project.scripts]
synthetic-producer = "synthetic_producer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
